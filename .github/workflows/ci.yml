name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update npm
        # package-lock.json is generated by npm 11, whose dependency tree
        # differs from the npm 10 that Node.js 22 bundles (`npm ci` fails the
        # sync check under npm 10). Pinned to the npm version that generates
        # the lockfile locally, and matching publish.yml, so CI installs with
        # the exact toolchain that develops and publishes.
        run: 'npm install -g npm@11.6.2'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Check formatting
        run: 'npx prettier --check .'

      - name: Audit runtime dependencies
        run: 'npm audit --omit=dev'

      - name: Typecheck
        run: 'npm run typecheck'

      - name: Run tests
        run: 'npm test'

      - name: Run build
        run: 'npm run build'
